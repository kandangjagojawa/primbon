<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primbon & Pawukon Jawa Jangkep</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-amber-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-amber-900 text-amber-100 p-6 text-center">
            <h1 class="text-3xl font-serif font-bold">Primbon & Pawukon Jangkep</h1>
            <p class="text-amber-200 text-sm mt-1">Perhitungan Weton, Neptu, Wuku, & Watak Jawa Online</p>
        </div>

        <!-- Form Input -->
        <form id="primbonForm" class="p-6 border-b border-amber-100 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-900 mb-1">Nama Lengkap *</label>
                <input type="text" id="nama" required placeholder="Contoh: Raden Patah" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-900 mb-1">Tanggal Lahir Masehi *</label>
                <input type="date" id="tglLahir" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-900 mb-1">Jam Lahir (Opsional)</label>
                <input type="time" id="jamLahir" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div class="md:col-span-3 mt-2">
                <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-medium py-2.5 rounded-lg transition duration-200">
                    Hitung Primbon Lengkap
                </button>
            </div>
        </form>

        <!-- Container Hasil Perhitungan -->
        <div id="hasilPrimbon" class="hidden p-6 space-y-6">
            <!-- Ringkasan Profil -->
            <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 id="resNama" class="text-2xl font-serif font-bold text-amber-900"></h2>
                    <p id="resWeton" class="text-amber-700 font-semibold text-lg"></p>
                </div>
                <div class="text-right">
                    <span id="resNeptu" class="inline-block bg-amber-800 text-white px-4 py-1 rounded-full text-sm font-bold"></span>
                    <p id="resWaktuCatatan" class="text-xs text-stone-500 mt-1"></p>
                </div>
            </div>

            <!-- Grid Perhitungan Detail -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-sm" id="detailsGrid">
                <!-- Data diinjeksi via JavaScript -->
            </div>

            <!-- Analisis Watak & Prediksi -->
            <div class="space-y-4 pt-4 border-t border-amber-100">
                <div class="bg-stone-50 p-4 rounded-lg border">
                    <h3 class="font-bold text-amber-900 text-base mb-2">🌿 Watak & Sifat Utama</h3>
                    <p id="resWatak" class="leading-relaxed text-stone-700"></p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-stone-50 p-4 rounded-lg border">
                        <h3 class="font-bold text-amber-900 text-base mb-2">💼 Karir & Pekerjaan Cocok</h3>
                        <p id="resKarir" class="leading-relaxed text-stone-700"></p>
                    </div>
                    <div class="bg-stone-50 p-4 rounded-lg border">
                        <h3 class="font-bold text-amber-900 text-base mb-2">💰 Rejeki & Keuangan</h3>
                        <p id="resRejeki" class="leading-relaxed text-stone-700"></p>
                    </div>
                    <div class="bg-stone-50 p-4 rounded-lg border">
                        <h3 class="font-bold text-amber-900 text-base mb-2">❤️ Jodoh & Match Neptu</h3>
                        <p id="resJodoh" class="leading-relaxed text-stone-700"></p>
                    </div>
                    <div class="bg-stone-50 p-4 rounded-lg border">
                        <h3 class="font-bold text-amber-900 text-base mb-2">⚠️ Hari Naas & Hari Baik</h3>
                        <p id="resHariNaas" class="leading-relaxed text-stone-700"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
